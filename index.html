<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Grade Calculator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .container {
      width: 90%;
      max-width: 450px;
      background: white;
      padding: 35px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 15px;
      outline: none;
    }

    input:focus {
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #667eea;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #5568d8;
    }

    #result {
      margin-top: 25px;
      padding: 20px;
      border-radius: 12px;
      background: #f5f5f5;
      display: none;
    }

    .grade {
      font-size: 32px;
      font-weight: bold;
      margin: 10px 0;
      color: #667eea;
    }

    .message {
      color: #555;
      font-size: 16px;
    }

    .error {
      color: #d32f2f;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Student Grade Calculator</h1>

    <p class="subtitle">
      Enter your marks and calculate your grade
    </p>

    <input
      type="number"
      id="marks"
      placeholder="Enter marks (0 - 100)"
      min="0"
      max="100"
    >

    <button onclick="calculateGrade()">
      Calculate Grade
    </button>

    <div id="result"></div>

  </div>


  <script>
    function calculateGrade() {

      const marksInput = document.getElementById("marks");
      const result = document.getElementById("result");

      const marks = Number(marksInput.value);

      result.style.display = "block";

      if (marksInput.value === "") {
        result.innerHTML =
          '<p class="error">Please enter your marks.</p>';
        return;
      }

      if (marks < 0 || marks > 100) {
        result.innerHTML =
          '<p class="error">Please enter marks between 0 and 100.</p>';
        return;
      }

      let grade;
      let message;

      if (marks >= 90) {
        grade = "A+";
        message = "Excellent Performance!";
      } 
      else if (marks >= 80) {
        grade = "A";
        message = "Very Good Performance!";
      } 
      else if (marks >= 70) {
        grade = "B";
        message = "Good Performance!";
      } 
      else if (marks >= 60) {
        grade = "C";
        message = "Satisfactory Performance.";
      } 
      else if (marks >= 50) {
        grade = "D";
        message = "You Passed.";
      } 
      else {
        grade = "F";
        message = "You need to improve.";
      }

      result.innerHTML = `
        <p>Your Marks: <strong>${marks}</strong></p>
        <div class="grade">${grade}</div>
        <p class="message">${message}</p>
      `;
    }
  </script>

</body>
</html>
